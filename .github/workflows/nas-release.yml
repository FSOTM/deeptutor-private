name: Private NAS release
on:
  workflow_dispatch:
  schedule:
    - cron: '10 20 * * *'
  push:
    branches: [io/nas-stable]
permissions:
  contents: write
concurrency:
  group: private-nas-release
  cancel-in-progress: false
jobs:
  verify-and-approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: io/nas-stable
          fetch-depth: 0
      - name: Prepare upstream merge and pinned image
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/nas/prepare_release.py
      - name: Set up Node
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test edit, resend, draft recovery and answer cards
        if: steps.prepare.outputs.changed == 'true'
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm run test:unit -- tests/chat-failed-submission-recovery.spec.tsx tests/chat-unsent-message-actions.spec.tsx tests/card-submission-acknowledgement.spec.tsx tests/mastery-question-card.spec.tsx tests/selection-speech.spec.tsx tests/reading-toolbar-selection.spec.tsx tests/reading-selection-sheet.spec.tsx tests/voice-settings.spec.tsx tests/chat-submission-clock.spec.tsx tests/unified-turn-client-errors.spec.ts
      - name: Verify cancellation and reconnect transport
        if: steps.prepare.outputs.changed == 'true'
        working-directory: web
        run: |
          npx tsc -p tsconfig.node-tests.json
          node -r ./scripts/register-node-test-aliases.cjs --test dist/node-tests/tests/turn-runtime-client.test.js
      - name: Build maintained frontend and package its runtime
        if: steps.prepare.outputs.changed == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.prepare.outputs.source_commit }}
        run: |
          cd web
          npm run build
          cd ..
          python3 deploy/nas/frontend_bundle.py create --source web/.next/standalone --archive "$RUNNER_TEMP/frontend.tar.gz" --metadata "$RUNNER_TEMP/frontend.json" --commit "$SOURCE_COMMIT"
          cp -a web/.next/standalone web-runtime
      - name: Build and verify policy, state, compaction and tool compatibility
        if: steps.prepare.outputs.changed == 'true'
        run: >-
          docker build --pull
          --build-arg BASE_IMAGE=${{ steps.prepare.outputs.base_image }}
          --build-arg SOURCE_COMMIT=${{ steps.prepare.outputs.source_commit }}
          -f deploy/nas/Dockerfile -t deeptutor-private:verified .
      - name: Approve only the tested source commit
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/nas/approve_release.py '${{ steps.prepare.outputs.source_commit }}' "$RUNNER_TEMP/frontend.json" "$RUNNER_TEMP/frontend.tar.gz"
